[project]
name = "nichelibrary"
version = "1.2.0"
description = "C++ library for competitive programming"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "clang-format>=20,<21",
    "clang-tidy>=20,<21",
    "clangd>=20,<21",
    "clangd-tidy>=1.1.1",
    "competitive-verifier",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "ruff>=0.15.12",
]

[tool.mypy]
python_version = "3.13"

[tool.pyright]
pythonVersion = "3.13"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv.sources]
competitive-verifier = { git = "https://github.com/NotLeonian/competitive-verifier", rev = "632cf0b3f9b4903d642f7f17e8296890ffc1c75f" }

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: disabled
    # 間接依存もバージョン更新の対象に含める。
    allow:
      - dependency-type: "all"
    # clang-format, clang-tidy, clangd のメジャーバージョンは 20 に統一する。
    ignore:
      - dependency-name: "clang-format"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clang-tidy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clangd"
        update-types: ["version-update:semver-major"]
    groups:
      # Clang のツールと clangd-tidy のバージョン更新を 1 つの PR にまとめる。
      clang-tools:
        applies-to: "version-updates"
        patterns:
          - "clang-format"
          - "clang-tidy"
          - "clangd"
          - "clangd-tidy"
      # pydantic が pydantic-core のバージョンを厳密に指定するため、まとめて更新する。
      pydantic:
        applies-to: "version-updates"
        patterns:
          - "pydantic"
          - "pydantic-core"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      # actions/* に一致する Action のバージョン更新を 1 つの PR にまとめる。
      actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
